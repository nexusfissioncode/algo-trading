[project]
name = "agent-desk"
version = "0.1.0"
description = "A desk of three Claude agents - analyst, risk manager, trader - on an Alpaca paper account."
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.2.163",
    "alpaca-py>=0.43",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
